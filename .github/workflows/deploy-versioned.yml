name: Deploy versioned website to EC2

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aws-devops-ec2-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy and validate commit release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout workflow commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Configure verified SSH connection
        shell: bash
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$EC2_SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          printf '%s\n' "$EC2_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Upload complete release to staging
        shell: bash
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          staging_dir="/tmp/aws-devops-site/${DEPLOY_SHA}"
          printf '%s\n' "$DEPLOY_SHA" > "$RUNNER_TEMP/VERSION"

          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i "$HOME/.ssh/deploy_key" \
            "$EC2_USER@$EC2_HOST" \
            "rm -rf -- '$staging_dir' && install -d -m 0755 -- '$staging_dir'"

          scp -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i "$HOME/.ssh/deploy_key" \
            index.html style.css "$RUNNER_TEMP/VERSION" \
            "$EC2_USER@$EC2_HOST:$staging_dir/"

      - name: Atomically activate and validate on EC2
        shell: bash
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i "$HOME/.ssh/deploy_key" \
            "$EC2_USER@$EC2_HOST" \
            sudo /usr/local/sbin/aws-devops-versioned-deploy \
              activate "$DEPLOY_SHA" "/tmp/aws-devops-site/$DEPLOY_SHA"

      - name: Validate served release externally
        shell: bash
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if ! bash scripts/validate-release.sh "$EC2_HOST" "$DEPLOY_SHA"; then
            echo "External validation failed; requesting rollback on EC2." >&2
            ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              -i "$HOME/.ssh/deploy_key" \
              "$EC2_USER@$EC2_HOST" \
              sudo /usr/local/sbin/aws-devops-versioned-deploy \
                rollback "$DEPLOY_SHA" || \
              echo "Rollback command also failed; inspect the server immediately." >&2
            exit 1
          fi

      - name: Remove SSH private key from runner
        if: always()
        shell: bash
        run: rm -f -- "$HOME/.ssh/deploy_key"
