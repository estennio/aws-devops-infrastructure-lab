name: Deploy website to EC2

# Legacy SSH deploy, kept as history until the SSM path has a recorded run.
# Manual-only: the Terraform-managed instance has SSH disabled by default, so
# an automatic run on every push to main would fail or target a stale host.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aws-devops-ec2-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy static site to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure SSH
        shell: bash
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$EC2_SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"

          printf '%s\n' "$EC2_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Upload website files
        shell: bash
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          set -euo pipefail

          ssh -i "$HOME/.ssh/deploy_key" "$EC2_USER@$EC2_HOST" \
            "mkdir -p /tmp/aws-devops-site"

          scp -i "$HOME/.ssh/deploy_key" \
            index.html style.css \
            "$EC2_USER@$EC2_HOST:/tmp/aws-devops-site/"

      - name: Deploy and validate Nginx
        shell: bash
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          set -euo pipefail

          ssh -i "$HOME/.ssh/deploy_key" "$EC2_USER@$EC2_HOST" <<'REMOTE'
          set -euo pipefail

          sudo mkdir -p /tmp/aws-devops-site
          sudo install -m 0644 /tmp/aws-devops-site/index.html /var/www/html/index.html
          sudo install -m 0644 /tmp/aws-devops-site/style.css /var/www/html/style.css

          sudo nginx -t
          sudo systemctl reload nginx

          curl -fsS http://127.0.0.1/ > /dev/null
          echo "Deployment verified successfully."
          REMOTE
