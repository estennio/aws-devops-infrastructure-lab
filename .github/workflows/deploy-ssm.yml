name: Deploy versioned website via SSM

on:
  workflow_dispatch:
    inputs:
      validation_host:
        description: "Leave empty. Overrides only the host of the external check; 127.0.0.1 forces a failure to test the rollback."
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: aws-devops-ec2-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy and validate commit release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The AWS role trusts only this environment. Configure required reviewers and
    # restrict deployment branches to main on the environment in GitHub settings.
    environment: production
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      # Written by Terraform (output deploy_parameter_prefix). The instance ID,
      # public host and release bucket are read from here at run time.
      DEPLOY_PARAMETER_PREFIX: ${{ vars.DEPLOY_PARAMETER_PREFIX || '/aws-devops-infrastructure-lab/deploy' }}
      VALIDATION_HOST_OVERRIDE: ${{ inputs.validation_host }}
      DEPLOY_SHA: ${{ github.sha }}

    steps:
      - name: Checkout workflow commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: github-deploy-${{ github.run_id }}

      - name: Resolve deployment targets from Terraform
        shell: bash
        run: |
          set -euo pipefail

          fail() { echo "::error::$*"; exit 1; }
          prefix="${DEPLOY_PARAMETER_PREFIX%/}"

          response="$(aws ssm get-parameters --output json --names \
            "${prefix}/instance-id" "${prefix}/public-host" "${prefix}/release-bucket")"
          missing="$(jq -r '.InvalidParameters | join(", ")' <<< "$response")"
          [[ -z "$missing" ]] || fail "Missing deploy parameters (${missing}); run terraform apply first."

          parameter() {
            jq -r --arg name "${prefix}/$1" '.Parameters[] | select(.Name == $name) | .Value' <<< "$response"
          }
          instance_id="$(parameter instance-id)"
          public_host="$(parameter public-host)"
          release_bucket="$(parameter release-bucket)"

          [[ "$instance_id" =~ ^i-[0-9a-f]{8,17}$ ]] || fail "Unexpected instance ID: ${instance_id}"
          [[ "$public_host" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]] || fail "Unexpected public host: ${public_host}"
          [[ "$release_bucket" =~ ^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$ ]] || fail "Unexpected bucket name: ${release_bucket}"

          validation_host="$public_host"
          if [[ -n "$VALIDATION_HOST_OVERRIDE" ]]; then
            [[ "$VALIDATION_HOST_OVERRIDE" =~ ^[A-Za-z0-9.-]{1,253}$ ]] || fail "Invalid validation_host input."
            validation_host="$VALIDATION_HOST_OVERRIDE"
            echo "::warning::External validation will use ${validation_host} instead of ${public_host}."
          fi

          {
            echo "EC2_INSTANCE_ID=${instance_id}"
            echo "EC2_HOST=${validation_host}"
            echo "RELEASE_BUCKET=${release_bucket}"
          } >> "$GITHUB_ENV"
          echo "Deploying to ${instance_id} (${public_host}) through s3://${release_bucket}."

      - name: Package and upload release to S3
        shell: bash
        run: |
          set -euo pipefail

          release_dir="$RUNNER_TEMP/release"
          install -d -m 0755 -- "$release_dir"
          cp index.html style.css "$release_dir/"
          printf '%s\n' "$DEPLOY_SHA" > "$release_dir/VERSION"

          aws s3 cp --only-show-errors --recursive \
            "$release_dir/" "s3://${RELEASE_BUCKET}/releases/${DEPLOY_SHA}/"

      - name: Download and activate release on EC2 via SSM
        shell: bash
        run: |
          set -euo pipefail

          # Runs as root on the instance; the script interface is unchanged.
          remote_script="$(cat <<REMOTE
          #!/bin/bash
          set -Eeuo pipefail
          staging_dir="/tmp/aws-devops-site/${DEPLOY_SHA}"
          # snap installs the AWS CLI under /snap/bin, which the SSM shell may not have on PATH.
          export PATH="\${PATH}:/snap/bin"
          command -v aws > /dev/null || { echo "AWS CLI not found; run scripts/bootstrap.sh on the instance first." >&2; exit 1; }
          rm -rf -- "\${staging_dir}"
          install -d -m 0755 -- "\${staging_dir}"
          aws s3 cp --only-show-errors --region "${AWS_REGION}" --recursive \
            "s3://${RELEASE_BUCKET}/releases/${DEPLOY_SHA}/" "\${staging_dir}/"
          /usr/local/sbin/aws-devops-versioned-deploy activate "${DEPLOY_SHA}" "\${staging_dir}"
          rm -rf -- "\${staging_dir}"
          REMOTE
          )"

          bash scripts/ssm-run.sh "$EC2_INSTANCE_ID" "$AWS_REGION" \
            "Activate release ${DEPLOY_SHA}" "$remote_script"

      - name: Validate served release externally
        shell: bash
        run: |
          set -euo pipefail

          if ! bash scripts/validate-release.sh "$EC2_HOST" "$DEPLOY_SHA"; then
            echo "External validation failed; requesting rollback on EC2 via SSM." >&2
            bash scripts/ssm-run.sh "$EC2_INSTANCE_ID" "$AWS_REGION" \
              "Rollback release ${DEPLOY_SHA}" \
              "/usr/local/sbin/aws-devops-versioned-deploy rollback ${DEPLOY_SHA}" || \
              echo "Rollback command also failed; inspect the server immediately." >&2
            exit 1
          fi
