version: 2
updates:
  # Workflow actions are pinned to commit SHAs; Dependabot proposes PRs that
  # move both the SHA and the version comment when a new release is published.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: terraform
    directories:
      - /infra/terraform
      - /infra/bootstrap
    schedule:
      interval: weekly
