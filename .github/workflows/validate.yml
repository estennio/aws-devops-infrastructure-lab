name: Validate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    name: Terraform fmt and validate (${{ matrix.dir }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir:
          - infra/terraform
          - infra/bootstrap
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.11.4

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Initialize without backend
        run: terraform init -backend=false -input=false

      - name: Validate configuration
        run: terraform validate

  tflint:
    name: TFLint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@90f302c255ef959cbfb4bd10581afecdb7ece3e6 # v4.1.1
        with:
          tflint_version: v0.53.0

      - name: Install TFLint plugins
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: tflint --init

      # --recursive from the repository root lints every Terraform root
      # (infra/terraform and infra/bootstrap) with the shared configuration.
      - name: Run TFLint
        run: tflint --recursive --config "${GITHUB_WORKSPACE}/.tflint.hcl" --format compact

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Lint shell scripts
        run: shellcheck scripts/*.sh

      # The .tftpl file is not valid shell as written: Terraform escapes ($${VAR})
      # and interpolates (${name}) it. Render it with placeholder values first.
      - name: Lint rendered user-data template
        run: |
          set -euo pipefail
          rendered="$(mktemp)"
          sed -e 's/\$\${/${/g' \
              -e "s/'\${repository_url}'/'https:\/\/example.invalid\/repo.git'/" \
              -e "s/'\${repository_ref}'/'main'/" \
              infra/terraform/templates/user-data.sh.tftpl > "${rendered}"
          shellcheck "${rendered}"

  security:
    name: Terraform security scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run Trivy config scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: infra
          severity: LOW,MEDIUM,HIGH,CRITICAL
          exit-code: "1"
